<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FichaAqui - Em Construção</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse-bg 4s ease-in-out infinite;
    }

    @keyframes pulse-bg {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 120px;
      height: 120px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(255, 255, 255, 0.1));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .brand-name {
      font-size: 2.5rem;
      font-weight: 900;
      color: #EB9B01;
      margin-top: 1.25rem;
      letter-spacing: -0.5px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: rgba(235, 155, 1, 0.4);
      margin: 2rem auto;
      border-radius: 2px;
      animation: expand 2s ease-in-out infinite alternate;
    }

    @keyframes expand {
      0% { width: 60px; opacity: 0.4; }
      100% { width: 120px; opacity: 1; }
    }

    .message {
      color: #FFFDEF;
      font-size: 1.25rem;
      font-weight: 400;
      opacity: 0.9;
    }

    .sub-message {
      color: rgba(255, 253, 239, 0.5);
      font-size: 0.9rem;
      margin-top: 0.75rem;
    }

    .dots {
      display: inline-flex;
      gap: 6px;
      margin-top: 2.5rem;
    }

    .dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EB9B01;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/img/logo.svg" alt="FichaAqui" class="logo">
    <h1 class="brand-name">Ficha Aqui</h1>
    <div class="divider"></div>
    <p class="message">Estamos preparando algo incrível para você!</p>
    <p class="sub-message">Em breve, a melhor experiência em gestão de fichas para eventos.</p>
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</body>
</html>
